<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones - Aplicación</title>
    <link rel="icon" href="assets/favicon-32x32.png" type="image/png">
    <link rel="icon" href="assets/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Inputs operativos para flujo de caja">
    <script defer src="vendor/xlsx.full.min.js"></script>
    <script defer src="data/financial-seed.js"></script>
    <script defer src="finance-model.js"></script>
    <script defer src="operations.js"></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Panel</a></li>
            <li><a href="flujo-caja.html">Tesorería</a></li>
            <li><a href="input.html">Operaciones</a></li>
            <li><a href="data-entry.html">Presupuesto Mensual</a></li>
            <li><a href="feriados.html">Calendario Laboral</a></li>
        </ul>
    </nav>

    <section id="input">
        <div class="page-heading">
            <h2>Operaciones</h2>
            <div class="toolbar">
                <button id="op-save" type="button">Guardar</button>
                <button id="op-reset" type="button">Restaurar Excel</button>
            </div>
        </div>

        <div class="cards-grid">
            <div class="card" id="op-objetivo-stock">
                <h3>Objetivo y Stock</h3>
                <div class="kv">
                    <label>Saldo inicial</label>
                    <output id="op-saldo-inicial"></output>

                    <label for="op-mes">Mes en curso</label>
                    <input id="op-mes" type="number" min="1" max="12" step="1" data-op-field="month">

                    <label for="op-dias-cobertura">Días objetivo de cobertura</label>
                    <input id="op-dias-cobertura" type="number" step="0.01" data-op-field="coverageDays">

                    <label for="op-objetivo-retiro">Objetivo Retiro Tn</label>
                    <input id="op-objetivo-retiro" type="number" step="0.001" data-op-field="targetWithdrawalTn">

                    <label for="op-stock-actual">Stock actual (ton)</label>
                    <input id="op-stock-actual" type="number" step="0.001" data-op-field="currentStockTn">

                    <label for="op-tn-retiradas">Tn retiradas a la fecha</label>
                    <input id="op-tn-retiradas" type="number" step="0.001" data-op-field="withdrawnToDateTn">

                    <label>Días stock en piso</label>
                    <output id="op-dias-stock"></output>

                    <label>Stock al cierre tn</label>
                    <output id="op-stock-cierre"></output>

                    <label>Stock ideal (ton)</label>
                    <output id="op-stock-ideal"></output>
                </div>
            </div>

            <div class="card emphasis" id="op-brecha-stock">
                <h3>Brecha a Stock ideal</h3>
                <div class="kv">
                    <label>Falta recuperar stock KG ideal</label>
                    <output id="op-falta-stock"></output>

                    <label>(ARS) Retiro faltante a stock ideal</label>
                    <output id="op-ars-stock-ideal"></output>

                    <label>Tn vs Obj + Stock ideal</label>
                    <output id="op-tn-vs-obj"></output>

                    <label>(ARS) Retiro faltante vs OBJ</label>
                    <output id="op-ars-vs-obj"></output>
                </div>
            </div>

            <div class="card" id="op-periodo">
                <h3>Período y días</h3>
                <div class="kv">
                    <label>Fecha inicio</label>
                    <output id="op-fecha-inicio"></output>

                    <label>Fecha fin</label>
                    <output id="op-fecha-fin"></output>

                    <label>Días trabajados</label>
                    <output id="op-dias-trabajados"></output>

                    <label>Días laborales</label>
                    <output id="op-dias-laborales"></output>

                    <label>Días restantes</label>
                    <output id="op-dias-restantes"></output>

                    <label>Tn a vender días restantes</label>
                    <output id="op-tn-restantes"></output>
                </div>
            </div>

            <div class="card" id="op-parametros">
                <h3>Parámetros</h3>
                <table class="mini-table">
                    <thead><tr><th>Parámetro</th><th class="right">Valor</th></tr></thead>
                    <tbody id="op-parametros-body"></tbody>
                </table>
            </div>

            <div class="card" id="op-fechas">
                <h3>Fechas calculadas</h3>
                <table class="mini-table" id="op-fechas-table">
                    <thead><tr><th>Concepto</th><th>Fecha</th><th>Mes Sig</th></tr></thead>
                    <tbody id="op-fechas-body"></tbody>
                </table>
            </div>

            <div class="card" id="op-variables">
                <h3>Variables</h3>
                <table class="mini-table">
                    <thead><tr><th>Variable</th><th class="right">Valor</th></tr></thead>
                    <tbody id="op-variables-body"></tbody>
                </table>
            </div>
        </div>
    </section>
</body>
</html>
