<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Mensual - Aplicación</title>
    <link rel="icon" href="assets/favicon-32x32.png" type="image/png">
    <link rel="icon" href="assets/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Data Entry mensual financiero">
    <script defer src="vendor/xlsx.full.min.js"></script>
    <script defer src="data/financial-seed.js"></script>
    <script defer src="finance-model.js"></script>
    <script defer src="budget.js"></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Panel</a></li>
            <li><a href="flujo-caja.html">Tesorería</a></li>
            <li><a href="input.html">Operaciones</a></li>
            <li><a href="data-entry.html">Presupuesto Mensual</a></li>
            <li><a href="feriados.html">Calendario Laboral</a></li>
        </ul>
    </nav>

    <section id="data-entry">
        <div class="page-heading">
            <div>
                <h2>Presupuesto mensual</h2>
                <p class="muted-copy">Replica la solapa Data Entry. Los promedios alimentan Operaciones y Tesorería.</p>
            </div>
            <div class="toolbar">
                <button id="budget-export" type="button">Exportar Excel</button>
                <button id="budget-reset" type="button">Restaurar Excel</button>
            </div>
        </div>

        <div class="budget-summary" id="budget-summary"></div>

        <div class="budget-tabs" role="tablist" aria-label="Vistas de presupuesto">
            <button type="button" class="active" data-budget-filter="ops">Operativo</button>
            <button type="button" data-budget-filter="expenses">Rubros</button>
        </div>

        <div class="card budget-card budget-workspace">
            <div class="section-title-row">
                <div>
                    <h3 id="budget-view-title">Datos mensuales operativos</h3>
                    <span class="muted-copy" id="budget-view-copy">Equivale a columnas A:J de Data Entry.</span>
                </div>
                <span class="sac-note">SAC se incluye solo en su mes operativo</span>
            </div>
            <div class="table-wrapper">
                <table class="mini-table budget-table budget-full-table" id="budget-full-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </section>
</body>
</html>
